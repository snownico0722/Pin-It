name: Build PinIt

# Builds the Rust/Slint app in rust/, runs its tests, and produces the
# Windows installer and portable ZIP on every push/PR. Tagging a version
# (e.g. v3.0.0) also publishes them to a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Read-only by default. Only the release job below — which runs for version
# tags alone — is allowed to write (create the GitHub Release).
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment) so a moved or compromised tag cannot change what runs here.
jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      # The runner image ships rustup with the MSVC toolchain and the
      # Windows SDK (rc.exe for the exe's icon and version resource).
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
        with:
          workspaces: rust

      - name: Test
        working-directory: rust
        run: cargo test --locked

      - name: Build
        working-directory: rust
        run: cargo build --release --locked

      - name: Stage the exe
        run: |
          New-Item -ItemType Directory -Force -Path dist\PinIt | Out-Null
          Copy-Item rust\target\release\pinit.exe dist\PinIt\PinIt.exe
          (Get-Item dist\PinIt\PinIt.exe).VersionInfo | Format-List FileVersion, ProductVersion

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PinIt.iss

      - name: Make portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\PinIt\* -DestinationPath release\PinIt-portable-x64.zip -Force

      # A copy of the installer under a name that doesn't change between
      # versions, so https://github.com/<repo>/releases/latest/download/PinIt-setup-x64.exe
      # always points at the newest one.
      - name: Add a stable-named installer
        run: |
          $installer = Get-ChildItem release\PinIt_*_x64-setup.exe | Select-Object -First 1
          Copy-Item $installer.FullName release\PinIt-setup-x64.exe

      # Lets anyone check a download against what CI built.
      - name: Write checksums
        run: |
          $lines = Get-ChildItem release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # LF line endings: with CRLF, `sha256sum -c` on Linux/macOS/Git Bash
          # reads the carriage return as part of each file name and fails.
          [IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content release\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: PinIt-windows
          path: release\*
          if-no-files-found: error

  release:
    name: Publish to Release (on tag)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the Release and upload its assets

    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: PinIt-windows
          path: release

      - name: Validate checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release/PinIt-portable-x64.zip
          test -f release/PinIt-setup-x64.exe
          tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          test "$tag" = "v3.1.0"
          gh release create "$tag" release/PinIt-portable-x64.zip release/PinIt-setup-x64.exe release/PinIt_3.1.0_x64-setup.exe release/SHA256SUMS.txt \
            --title "PinIt 3.1.0" --target "$GITHUB_SHA" --notes-file RELEASE_NOTES_3.1.0.md --latest
